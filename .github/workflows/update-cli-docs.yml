name: Update CLI Documentation

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cli-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install eval-protocol
        run: pip install eval-protocol

      - name: Generate CLI documentation
        run: ep export-docs --output reference/cli.mdx

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet reference/cli.mdx; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update CLI reference documentation'
          title: 'docs: update CLI reference documentation'
          body: |
            This PR updates the CLI reference documentation from the latest `eval-protocol` package.

            Generated automatically by the `update-cli-docs` workflow.
          branch: docs/update-cli-reference
          delete-branch: true
          labels: documentation

